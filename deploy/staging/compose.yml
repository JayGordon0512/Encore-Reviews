name: encore-staging

x-app: &app
  image: encore-staging/app:${APP_IMAGE_TAG:-main}
  env_file:
    - ${STAGING_ENV_FILE:-/opt/encore-staging/shared/.env}
  restart: unless-stopped
  volumes:
    - app-storage:/var/www/html/storage
  depends_on:
    database:
      condition: service_healthy

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-encore}
      POSTGRES_USER: ${POSTGRES_USER:-encore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    <<: *app
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: app

  web:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: web
    image: encore-staging/web:${APP_IMAGE_TAG:-main}
    restart: unless-stopped
    ports:
      - 127.0.0.1:8081:80
    volumes:
      - app-storage:/var/www/html/storage:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: php artisan queue:work database --queue=invitations --tries=1 --timeout=60 --sleep=3 --max-time=3600

  scheduler:
    <<: *app
    command: php artisan schedule:work

  backup:
    image: amazon/aws-cli:2.27.50
    profiles:
      - operations
    env_file:
      - ${STAGING_ENV_FILE:-/opt/encore-staging/shared/.env}
    volumes:
      - /opt/encore-staging/backups:/backups

volumes:
  app-storage:
  database-data:
